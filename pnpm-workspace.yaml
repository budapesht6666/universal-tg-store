packages:
  - packages/*
  - apps/*

# Единые версии зависимостей для всего монорепо (в package.json пишется "catalog:")
catalog:
  "@biomejs/biome": 2.6.7
  "@types/node": ^26.6.6
  typescript: ^7.0.2
  vitest: ^5.1.0
  zod: ^4.6.7

# pnpm 11+: скрипты установки зависимостей разрешаются явно
allowBuilds:
  esbuild: true
  better-sqlite3: true
  sharp: true
