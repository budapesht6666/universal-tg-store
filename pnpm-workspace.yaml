packages:
  - packages/*
  - apps/*

# Единые версии зависимостей для всего монорепо (в package.json пишется "catalog:")
catalog:
  "@biomejs/biome": 2.6.7
  "@types/node": ^26.6.6
  typescript: ^7.0.2
  vitest: ^5.1.0
  zod: ^4.6.7
  hono: ^4.13.18
  "@hono/node-server": ^2.1.8
  grammy: ^1.46.0
  drizzle-orm: ^0.45.4
  drizzle-kit: ^0.31.11
  # ~13.0: 13.1+ слишком свежие для minimumReleaseAge (ноябрь 2026)
  better-sqlite3: ~13.0.3
  "@types/better-sqlite3": ^9.6.0
  "@tma.js/init-data-node": ^2.0.8
  sharp: ^0.35.5
  vite: ^8.3.0
  "@vitejs/plugin-react": ^6.3.0
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  tailwindcss: ^4.3.0
  "@tailwindcss/vite": ^4.3.0
  "@tanstack/react-router": ^1.170.0
  "@tanstack/react-query": ^5.107.0
  zustand: ^5.1.0
  "@tma.js/sdk-react": ^3.0.23
  maplibre-gl: ^6.17.0
  lucide-react: ^1.72.0

# pnpm 11+: скрипты установки зависимостей разрешаются явно
allowBuilds:
  esbuild: true
  better-sqlite3: true
  sharp: true
