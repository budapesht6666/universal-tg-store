<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Меню с вкладками категорий</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
*::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F2F2F7; color: #0B0B0C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, system-ui, sans-serif; font-size: 15px; line-height: 20px">

  <div style="height: 48px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid #E4E4EA">
    <span style="width: 72px; color: #B5482A; font-size: 16px">Закрыть</span>
    <span style="font-size: 16px; font-weight: 600">Печка</span>
    <span aria-hidden="true" style="width: 72px; display: flex; justify-content: flex-end; color: #B5482A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
    </span>
  </div>

  <div style="flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #FFFFFF">
    <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="38" y="6" width="9" height="16" rx="2" fill="#B5482A"></rect>
      <rect x="10" y="18" width="44" height="38" rx="7" fill="#B5482A"></rect>
      <path d="M21 50V40a11 11 0 0 1 22 0v10z" fill="#FFFFFF"></path>
      <path d="M32 48c-3.6 0-6-2.5-6-5.6 0-3.6 3.4-5.4 3.6-9.4 2.9 1.8 8.4 5.6 8.4 9.6 0 3-2.4 5.4-6 5.4z" fill="#F2A541"></path>
    </svg>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <span style="font-size: 17px; line-height: 22px; font-weight: 700">Домашняя еда</span>
      <span style="font-size: 13px; line-height: 18px; color: #6B6B73"><span style="color: #17753A; font-weight: 600">Открыто до 22:00</span> · доставка бесплатно</span>
    </div>
  </div>

  <nav aria-label="Разделы меню" style="flex: none; display: flex; gap: 20px; padding: 0 16px; overflow-x: auto; background: #FFFFFF; border-bottom: 1px solid #E4E4EA">
    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
      <a href="#menu" aria-current="{{tb.current}}" style="height: 44px; flex: none; display: flex; align-items: center; border-bottom: 3px solid {{tb.line}}; color: {{tb.fg}}; font-weight: {{tb.weight}}; text-decoration: none; white-space: nowrap">{{tb.label}}</a>
    </sc-for>
  </nav>

  <main id="menu" style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 4px; padding-bottom: 96px">
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column">
        <h2 style="margin: 0; padding: 16px 16px 8px; font-size: 20px; line-height: 26px; font-weight: 700">{{sec.title}}</h2>
        <div style="display: flex; flex-direction: column; background: #FFFFFF">
          <sc-for list="{{sec.items}}" as="d" hint-placeholder-count="2">
            <article style="display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #EFEFF3; opacity: {{d.opacity}}">
              <div style="width: 92px; height: 92px; flex: none; position: relative; border-radius: 14px; background: {{d.tile}}; display: flex; align-items: center; justify-content: center; color: {{d.ink}}">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg>
                <sc-if value="{{d.hasBadge}}" hint-placeholder-val="{{ false }}">
                  <span style="position: absolute; top: 6px; left: 6px; height: 20px; padding: 0 6px; display: flex; align-items: center; border-radius: 6px; background: #FFFFFF; color: #8F3520; font-size: 11px; font-weight: 700">{{d.badge}}</span>
                </sc-if>
              </div>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <h3 style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 600">{{d.name}}</h3>
                <p style="margin: 0; font-size: 13px; line-height: 17px; color: #6B6B73">{{d.desc}}</p>
                <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px">
                  <div style="display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap">
                    <span style="font-size: 15px; font-weight: 700">{{d.price}}</span>
                    <sc-if value="{{d.hasOld}}" hint-placeholder-val="{{ false }}">
                      <span style="font-size: 13px; color: #6B6B73; text-decoration: line-through">{{d.old}}</span>
                      <span style="height: 18px; padding: 0 5px; display: inline-flex; align-items: center; border-radius: 5px; background: #C2410C; color: #FFFFFF; font-size: 11px; font-weight: 700">−15%</span>
                    </sc-if>
                    <span style="font-size: 12px; color: #6B6B73">{{d.portion}}</span>
                  </div>
                  <sc-if value="{{d.soldOut}}" hint-placeholder-val="{{ false }}">
                    <span style="height: 32px; padding: 0 10px; display: flex; align-items: center; border-radius: 10px; background: #EFEFF3; color: #6B6B73; font-size: 13px; font-weight: 600">Закончилось</span>
                  </sc-if>
                  <sc-if value="{{d.canAdd}}" hint-placeholder-val="{{ true }}">
                    <button aria-label="Добавить {{d.name}}" style="width: 36px; height: 36px; flex: none; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: #FBE9E2; color: #8F3520; cursor: pointer">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>
                    </button>
                  </sc-if>
                  <sc-if value="{{d.inCart}}" hint-placeholder-val="{{ false }}">
                    <div style="height: 36px; flex: none; display: flex; align-items: center; border-radius: 12px; background: #B5482A; color: #FFFFFF; font-weight: 700">
                      <button aria-label="Убрать одну порцию" style="width: 34px; height: 36px; border: 0; background: transparent; color: #FFFFFF; font-size: 18px; cursor: pointer">−</button>
                      <span style="min-width: 16px; text-align: center">{{d.qty}}</span>
                      <button aria-label="Добавить порцию" style="width: 34px; height: 36px; border: 0; background: transparent; color: #FFFFFF; font-size: 18px; cursor: pointer">+</button>
                    </div>
                  </sc-if>
                </div>
              </div>
            </article>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: #F2F2F7">
    <a href="ShopCheckout.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-radius: 14px; background: #B5482A; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">
      <span>Корзина · 3</span>
      <span>330 000 ₫</span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ic = {
      meal: 'M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7',
      soup: 'M12 21a9 9 0 0 0 9-9H3a9 9 0 0 0 9 9ZM7 21h10M19.5 12 22 6M16 3c.3.1.8.5.8 1.4-.1.8-1 1.2-1 2 0 .8.3 1.2.7 1.6M11 3c.3.1.8.5.8 1.4-.1.8-1 1.2-1 2 0 .8.3 1.2.7 1.6M6 3c.3.1.8.5.8 1.4-.1.8-1 1.2-1 2 0 .8.3 1.2.7 1.6',
      kid: 'M9 12h.01M15 12h.01M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5M19 6.3a9 9 0 0 1 1.8 3.9 2 2 0 0 1 0 3.6 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5s-.9 2.5-2 2.5c-.8 0-1.5-.4-1.5-1'
    };
    const dish = (o) => Object.assign({ opacity: '1', hasBadge: !!o.badge, hasOld: !!o.old, soldOut: false, canAdd: !o.qty && !o.soldOut, inCart: !!o.qty, tile: '#FBE9E2', ink: '#8F3520' }, o, { soldOut: !!o.soldOut, opacity: o.soldOut ? '0.55' : '1' });
    const tabs = ['Обеды', 'Супы', 'Горячее', 'Заморозка', 'Салаты', 'Десерты'].map((l, i) => ({
      label: l, current: i === 0 ? 'true' : 'false', line: i === 0 ? '#B5482A' : 'transparent', fg: i === 0 ? '#B5482A' : '#6B6B73', weight: i === 0 ? '700' : '500'
    }));
    return {
      tabs: tabs,
      sections: [
        { title: 'Обеды', items: [
          dish({ name: 'Комплексный обед', desc: 'Борщ, котлета с пюре, салат из свежей капусты', price: '160 000 ₫', portion: '1 обед', badge: 'Хит', icon: ic.meal, qty: 1 }),
          dish({ name: 'Обед для ребёнка', desc: 'Куриный суп, тефтели с гречкой. Без специй и соусов', price: '120 000 ₫', portion: '1 обед', badge: 'Детское', icon: ic.kid, tile: '#E8F1E4', ink: '#2F5E24' })
        ] },
        { title: 'Супы', items: [
          dish({ name: 'Борщ с говядиной', desc: 'Со сметаной и чесночной пампушкой', price: '85 000 ₫', old: '100 000 ₫', portion: '450 мл', icon: ic.soup, qty: 2 }),
          dish({ name: 'Солянка мясная', desc: 'Копчёности, оливки, лимон', price: '95 000 ₫', portion: '450 мл', icon: ic.soup, soldOut: true, tile: '#EFEFF3', ink: '#6B6B73' }),
          dish({ name: 'Куриный суп с лапшой', desc: 'Домашняя лапша, укроп', price: '70 000 ₫', portion: '350 мл', icon: ic.soup, tile: '#FDF1DC', ink: '#7A4B06' })
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
