# /srv/apps/pechka/compose.yml (схема vps-ops, тип web).
# Имя контейнера должно совпадать с reverse_proxy в Caddyfile.
services:
  app:
    build: ./repo
    container_name: pechka
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      - edge
    init: true
    stop_grace_period: 20s
    mem_limit: 512m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true
